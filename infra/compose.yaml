# Uma instalação do Cérebro: PostgreSQL e API (e, se ligados, antivírus, atualizador,
# backup e formulários públicos).
#
# Nada neste arquivo é segredo. A chave da instância e as senhas do banco são
# geradas no primeiro start, dentro do volume "config", e nunca saem dele. Cada serviço
# monta só a pasta dos segredos que usa (volume com subpath, Docker 26 ou mais novo):
#   api/      chave da instância e senhas com que a API conecta (API e migrações)
#   db/       senha de administrador do banco (banco, migrações e cópias)
#   updater/  chave das requisições assinadas entre a API e o atualizador
#   backup/   chave das cópias e o rclone.conf (só o serviço de cópias)
#   forms/    senha e chave dos formulários públicos
#
#   CEREBRO_PUBLIC_ORIGIN=https://cerebro.exemplo.com docker compose --file infra/compose.yaml up --detach
#
# A API fica publicada só em 127.0.0.1: quem a expõe à internet é o proxy
# reverso do servidor (TLS), nunca este arquivo.

name: cerebro

x-api: &api
  image: ${CEREBRO_IMAGE:-cerebro-api:local}
  environment:
    CEREBRO_ENV: production
    CEREBRO_PUBLIC_ORIGIN: ${CEREBRO_PUBLIC_ORIGIN:?defina CEREBRO_PUBLIC_ORIGIN, por exemplo https://cerebro.exemplo.com}
    CEREBRO_TRUST_PROXY: 'true'
    CEREBRO_DB_HOST: postgres
    CEREBRO_DB_NAME: cerebro
    CEREBRO_MAX_ATTACHMENT_MB: ${CEREBRO_MAX_ATTACHMENT_MB:-2048}
    CEREBRO_REQUESTS_PER_MINUTE: ${CEREBRO_REQUESTS_PER_MINUTE:-1200}
    # Vazio: anexos desligados até a instalação escolher. "clamd://clamav:3310" usa o
    # serviço clamav abaixo; "off" guarda os arquivos marcados como não verificados.
    CEREBRO_ANTIVIRUS: ${CEREBRO_ANTIVIRUS:-}
    # Com o atualizador ligado (--profile updater): http://updater:8080.
    CEREBRO_UPDATER_URL: ${CEREBRO_UPDATER_URL:-}
    # Com o backup ligado (--profile backup), a API lê a situação das cópias daqui.
    CEREBRO_BACKUP_STATUS: ${CEREBRO_BACKUP_STATUS:-}
    # Com os formulários ligados (--profile forms): o endereço deles, para mostrar e copiar.
    CEREBRO_FORMS_ORIGIN: ${CEREBRO_FORMS_ORIGIN:-}
  # Sistema de arquivos somente leitura, sem capacidades do kernel, sem ganho de privilégio.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  networks:
    - db

services:
  # Roda uma vez: cria os segredos da instância se ainda não existirem.
  init:
    <<: *api
    command: [init-secrets]
    restart: 'no'
    # O único que vê o volume inteiro: cria as pastas e os segredos (e muda de lugar os de
    # instalações anteriores às pastas).
    volumes:
      - config:/opt/cerebro/config

  postgres:
    image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: cerebro
      POSTGRES_PASSWORD_FILE: /run/cerebro/admin-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: volume
        source: config
        target: /run/cerebro
        read_only: true
        volume:
          subpath: db
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'pg_isready --username postgres --dbname cerebro --quiet']
      interval: 5s
      timeout: 3s
      retries: 30
    # A imagem oficial começa como root para preparar o diretório de dados e
    # então troca para o usuário "postgres"; só as capacidades que isso exige.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CEREBRO_DB_MEMORY:-1g}
    pids_limit: 512
    # Sem "ports": o banco só existe na rede interna.
    networks:
      - db

  # Roda a cada start: aplica migrações pendentes com o usuário dono do banco,
  # que a API nunca usa.
  migrate:
    <<: *api
    command: [migrate]
    restart: 'no'
    volumes:
      - type: volume
        source: config
        target: /opt/cerebro/config/api
        read_only: true
        volume:
          subpath: api
      - type: volume
        source: config
        target: /opt/cerebro/config/db
        read_only: true
        volume:
          subpath: db
      - type: volume
        source: config
        target: /opt/cerebro/config/forms
        read_only: true
        volume:
          subpath: forms
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    command: [serve]
    restart: unless-stopped
    # Só a API monta os anexos; nenhum outro serviço os alcança. Da configuração, só a própria
    # pasta (onde também fica o token de instalação) e a chave do atualizador: nunca a senha de
    # administrador do banco nem a chave das cópias.
    volumes:
      - type: volume
        source: config
        target: /opt/cerebro/config/api
        volume:
          subpath: api
      - type: volume
        source: config
        target: /opt/cerebro/config/updater
        read_only: true
        volume:
          subpath: updater
      - files:/opt/cerebro/files
      # Só leitura: a situação que o serviço de backup escreve.
      - backup-status:/opt/cerebro/backup-status:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: ${CEREBRO_API_MEMORY:-512m}
    ports:
      - '127.0.0.1:${CEREBRO_HOST_PORT:-3000}:3000'
    networks:
      - db
      - edge
      - scan
      - updates

  # Opcional: antivírus dos anexos (ClamAV). Sobe com --profile antivirus e usa de 1,2 a
  # 1,5 GB de memória. Recebe arquivos só da API, pela rede "scan"; sai para baixar as
  # assinaturas novas por uma rede só dele, sem alcançar nenhum outro serviço (ele lê o que
  # qualquer pessoa manda: se um arquivo o enganar, fica preso aqui). Não publica porta
  # nenhuma. Das permissões do root, só as que ele usa para preparar as pastas e trocar para
  # o usuário clamav.
  clamav:
    image: clamav/clamav:stable@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e
    profiles: [antivirus]
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: ${CEREBRO_CLAMAV_MEMORY:-2g}
    pids_limit: 256
    networks:
      - scan
      - clamav-out

  # Opcional: o atualizador (--profile updater). É o único serviço com o socket do Docker.
  # Só a API fala com ele, pela rede "updates", com requisições assinadas; ele não publica
  # porta nenhuma e só atualiza quando um Dono pede pela página. Lê as versões do repositório
  # em CEREBRO_UPDATE_REPOSITORY e só aceita as assinadas pelo fluxo de release dele. Sai para
  # a internet por uma rede só dele: nenhum outro serviço chega até ele por ali.
  updater:
    image: ${CEREBRO_UPDATER_IMAGE:-cerebro-updater:local}
    profiles: [updater]
    restart: unless-stopped
    environment:
      CEREBRO_UPDATE_REPOSITORY: ${CEREBRO_UPDATE_REPOSITORY:-}
      CEREBRO_API_HEALTH_URL: http://api:3000/api/health
    volumes:
      # Só a chave das requisições; os outros segredos da instância nem aparecem aqui.
      - type: volume
        source: config
        target: /opt/cerebro/config/updater
        read_only: true
        volume:
          subpath: updater
      # Este diretório: o compose.yaml e o .env com a imagem em uso, que ele troca.
      - ./:/opt/cerebro/compose
      - backups:/opt/cerebro/backups
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/cerebro-updater
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    networks:
      - updates
      - updater-out
    depends_on:
      init:
        condition: service_completed_successfully

  # Opcional: as cópias (--profile backup). Todo dia, na hora de CEREBRO_BACKUP_HOUR (03h por
  # padrão, no fuso TZ), copia banco, anexos e configuração para o repositório do restic em
  # CEREBRO_BACKUP_REPOSITORY, cifrados antes de sair; guarda um ano; no dia 1, prova que a cópia
  # restaura. Lê anexos e configuração sem poder mudá-los (a configuração inteira, porque sem
  # ela a cópia não restaura); não tem o socket do Docker.
  # Opcional: formulários públicos (--profile forms), num endereço próprio que o proxy reverso
  # aponta para a porta 3001. Monta só a pasta "forms" da configuração: a senha de um papel do
  # banco que não lê tabela nenhuma, só mostra e envia formulários, e a chave do carimbo contra
  # robôs. Não vê a chave da instância, as outras senhas nem os anexos. Precisa do Docker 26+
  # (volume com subpath).
  forms:
    image: ${CEREBRO_IMAGE:-cerebro-api:local}
    profiles: [forms]
    command: [forms]
    restart: unless-stopped
    environment:
      CEREBRO_ENV: production
      CEREBRO_FORMS_ORIGIN: ${CEREBRO_FORMS_ORIGIN:-}
      CEREBRO_FORMS_CONFIG_DIR: /opt/cerebro/forms-config
      CEREBRO_FORMS_PORT: '3001'
      CEREBRO_TRUST_PROXY: 'true'
      CEREBRO_DB_HOST: postgres
      CEREBRO_DB_NAME: cerebro
    volumes:
      - type: volume
        source: config
        target: /opt/cerebro/forms-config
        read_only: true
        volume:
          subpath: forms
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CEREBRO_FORMS_MEMORY:-256m}
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - '127.0.0.1:${CEREBRO_FORMS_HOST_PORT:-3001}:3001'
    networks:
      - db
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: ${CEREBRO_BACKUP_IMAGE:-cerebro-backup:local}
    profiles: [backup]
    restart: unless-stopped
    environment:
      CEREBRO_BACKUP_REPOSITORY: ${CEREBRO_BACKUP_REPOSITORY:-/repo}
      CEREBRO_BACKUP_HOUR: ${CEREBRO_BACKUP_HOUR:-3}
      # "backup" ou "backup+test": uma cópia (e o teste) logo ao subir, para conferir a instalação.
      CEREBRO_BACKUP_NOW: ${CEREBRO_BACKUP_NOW:-}
      CEREBRO_DB_HOST: postgres
      CEREBRO_DB_NAME: cerebro
      TZ: ${TZ:-UTC}
    volumes:
      - config:/data/config:ro
      - files:/data/files:ro
      - backup-status:/status
      # Destino local: serve para testar e não protege contra a perda do servidor. Para o
      # Google Drive, CEREBRO_BACKUP_REPOSITORY=rclone:<remoto>:<pasta> e rclone.conf na
      # configuração da instância.
      - backup-repo:/repo
      - backup-work:/work
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CEREBRO_BACKUP_MEMORY:-512m}
    pids_limit: 128
    networks:
      - db
      - edge
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # Sem rota para fora: o banco não alcança a internet nem é alcançado por ela.
  db:
    internal: true
  # Só a API e o antivírus; sem rota para fora.
  scan:
    internal: true
  edge: {}
  # Só a API e o atualizador; sem rota para fora.
  updates:
    internal: true
  # A saída do atualizador para o GitHub, só dele.
  updater-out: {}
  # A saída do antivírus para as assinaturas novas, só dele.
  clamav-out: {}

volumes:
  config: {}
  pgdata: {}
  # Anexos, cifrados arquivo a arquivo. Entram no backup junto com o banco.
  files: {}
  clamav: {}
  # Cópias do banco feitas pelo atualizador antes de cada atualização.
  backups: {}
  # Serviço de backup: situação (lida pela API), repositório local e espaço de trabalho.
  backup-status: {}
  backup-repo: {}
  backup-work: {}
