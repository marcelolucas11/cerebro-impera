# Uma instalação do Cérebro: PostgreSQL e API.
#
# Nada neste arquivo é segredo. A chave da instância e as senhas do banco são
# geradas no primeiro start, dentro do volume "config", e nunca saem dele.
#
#   CEREBRO_PUBLIC_ORIGIN=https://cerebro.exemplo.com docker compose --file infra/compose.yaml up --detach
#
# A API fica publicada só em 127.0.0.1: quem a expõe à internet é o proxy
# reverso do servidor (TLS), nunca este arquivo.

name: cerebro

x-api: &api
  image: ${CEREBRO_IMAGE:-cerebro-api:local}
  environment:
    CEREBRO_ENV: production
    CEREBRO_PUBLIC_ORIGIN: ${CEREBRO_PUBLIC_ORIGIN:?defina CEREBRO_PUBLIC_ORIGIN, por exemplo https://cerebro.exemplo.com}
    CEREBRO_TRUST_PROXY: 'true'
    CEREBRO_DB_HOST: postgres
    CEREBRO_DB_NAME: cerebro
    CEREBRO_MAX_ATTACHMENT_MB: ${CEREBRO_MAX_ATTACHMENT_MB:-2048}
    CEREBRO_REQUESTS_PER_MINUTE: ${CEREBRO_REQUESTS_PER_MINUTE:-1200}
    # Vazio: anexos desligados até a instalação escolher. "clamd://clamav:3310" usa o
    # serviço clamav abaixo; "off" guarda os arquivos marcados como não verificados.
    CEREBRO_ANTIVIRUS: ${CEREBRO_ANTIVIRUS:-}
    # Com o atualizador ligado (--profile updater): http://updater:8080.
    CEREBRO_UPDATER_URL: ${CEREBRO_UPDATER_URL:-}
    # Com o backup ligado (--profile backup), a API lê a situação das cópias daqui.
    CEREBRO_BACKUP_STATUS: ${CEREBRO_BACKUP_STATUS:-}
  volumes:
    - config:/opt/cerebro/config
  # Sistema de arquivos somente leitura, sem capacidades do kernel, sem ganho de privilégio.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  networks:
    - db

services:
  # Roda uma vez: cria os segredos da instância se ainda não existirem.
  init:
    <<: *api
    command: [init-secrets]
    restart: 'no'

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cerebro
      POSTGRES_PASSWORD_FILE: /run/cerebro/db-admin-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - config:/run/cerebro:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'pg_isready --username postgres --dbname cerebro --quiet']
      interval: 5s
      timeout: 3s
      retries: 30
    # A imagem oficial começa como root para preparar o diretório de dados e
    # então troca para o usuário "postgres"; só as capacidades que isso exige.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CEREBRO_DB_MEMORY:-1g}
    pids_limit: 512
    # Sem "ports": o banco só existe na rede interna.
    networks:
      - db

  # Roda a cada start: aplica migrações pendentes com o usuário dono do banco,
  # que a API nunca usa.
  migrate:
    <<: *api
    command: [migrate]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    command: [serve]
    restart: unless-stopped
    # Só a API monta os anexos; nenhum outro serviço os alcança.
    volumes:
      - config:/opt/cerebro/config
      - files:/opt/cerebro/files
      # Só leitura: a situação que o serviço de backup escreve.
      - backup-status:/opt/cerebro/backup-status:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: ${CEREBRO_API_MEMORY:-512m}
    ports:
      - '127.0.0.1:${CEREBRO_HOST_PORT:-3000}:3000'
    networks:
      - db
      - edge
      - scan
      - updates

  # Opcional: antivírus dos anexos (ClamAV). Sobe com --profile antivirus e usa de 1,2 a
  # 1,5 GB de memória. Recebe arquivos só da API, pela rede "scan"; a rede "edge" serve
  # apenas para baixar as assinaturas novas. Não publica porta nenhuma.
  clamav:
    image: clamav/clamav:stable
    profiles: [antivirus]
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CEREBRO_CLAMAV_MEMORY:-2g}
    pids_limit: 256
    networks:
      - scan
      - edge

  # Opcional: o atualizador (--profile updater). É o único serviço com o socket do Docker.
  # Só a API fala com ele, pela rede "updates", com requisições assinadas; ele não publica
  # porta nenhuma e só atualiza quando um Dono pede pela página. Lê as versões do repositório
  # em CEREBRO_UPDATE_REPOSITORY e só aceita as assinadas pelo fluxo de release dele.
  updater:
    image: ${CEREBRO_UPDATER_IMAGE:-cerebro-updater:local}
    profiles: [updater]
    restart: unless-stopped
    environment:
      CEREBRO_UPDATE_REPOSITORY: ${CEREBRO_UPDATE_REPOSITORY:-}
      CEREBRO_API_HEALTH_URL: http://api:3000/api/health
    volumes:
      # Só lê a chave das requisições; os segredos da instância nunca são escritos aqui.
      - config:/opt/cerebro/config:ro
      # Este diretório: o compose.yaml e o .env com a imagem em uso, que ele troca.
      - ./:/opt/cerebro/compose
      - backups:/opt/cerebro/backups
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/cerebro-updater
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    networks:
      - updates
      - edge
    depends_on:
      init:
        condition: service_completed_successfully

  # Opcional: as cópias (--profile backup). Todo dia, na hora de CEREBRO_BACKUP_HOUR (03h por
  # padrão, no fuso TZ), copia banco, anexos e configuração para o repositório do restic em
  # CEREBRO_BACKUP_REPOSITORY, cifrados antes de sair; guarda um ano; no dia 1, prova que a cópia
  # restaura. Lê anexos e configuração sem poder mudá-los; não tem o socket do Docker.
  backup:
    image: ${CEREBRO_BACKUP_IMAGE:-cerebro-backup:local}
    profiles: [backup]
    restart: unless-stopped
    environment:
      CEREBRO_BACKUP_REPOSITORY: ${CEREBRO_BACKUP_REPOSITORY:-/repo}
      CEREBRO_BACKUP_HOUR: ${CEREBRO_BACKUP_HOUR:-3}
      # "backup" ou "backup+test": uma cópia (e o teste) logo ao subir, para conferir a instalação.
      CEREBRO_BACKUP_NOW: ${CEREBRO_BACKUP_NOW:-}
      CEREBRO_DB_HOST: postgres
      CEREBRO_DB_NAME: cerebro
      TZ: ${TZ:-UTC}
    volumes:
      - config:/data/config:ro
      - files:/data/files:ro
      - backup-status:/status
      # Destino local: serve para testar e não protege contra a perda do servidor. Para o
      # Google Drive, CEREBRO_BACKUP_REPOSITORY=rclone:<remoto>:<pasta> e rclone.conf na
      # configuração da instância.
      - backup-repo:/repo
      - backup-work:/work
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CEREBRO_BACKUP_MEMORY:-512m}
    pids_limit: 128
    networks:
      - db
      - edge
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # Sem rota para fora: o banco não alcança a internet nem é alcançado por ela.
  db:
    internal: true
  # Só a API e o antivírus; sem rota para fora.
  scan:
    internal: true
  edge: {}
  # Só a API e o atualizador; sem rota para fora.
  updates:
    internal: true

volumes:
  config: {}
  pgdata: {}
  # Anexos, cifrados arquivo a arquivo. Entram no backup junto com o banco.
  files: {}
  clamav: {}
  # Cópias do banco feitas pelo atualizador antes de cada atualização.
  backups: {}
  # Serviço de backup: situação (lida pela API), repositório local e espaço de trabalho.
  backup-status: {}
  backup-repo: {}
  backup-work: {}
