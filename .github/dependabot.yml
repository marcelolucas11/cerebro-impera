version: 2
# Nenhuma versão nova é proposta antes de três dias publicada (a mesma regra das dependências
# novas). As imagens ficam fixadas pelo hash; é por aqui que os hashes novos chegam.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    # O grupo junta só as versões menores e de correção. Uma versão maior (TypeScript 7, por
    # exemplo) vem sozinha, para ser avaliada como mudança própria.
    groups:
      desenvolvimento:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Os tipos do Node acompanham o Node que roda o Cérebro (22, em .nvmrc), não o mais novo.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/updater
      - /apps/backup
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
