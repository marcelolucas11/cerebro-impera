version: 2
# Nenhuma versão nova é proposta antes de três dias publicada (a mesma regra das dependências
# novas). As imagens ficam fixadas pelo hash; é por aqui que os hashes novos chegam.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      desenvolvimento:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/updater
      - /apps/backup
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
