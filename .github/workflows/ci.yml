name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: nenhum job recebe mais do que leitura do código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (versão fixa, checksum conferido)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Varrer todo o histórico
        run: '"${RUNNER_TEMP}/gitleaks/gitleaks" git --no-banner --redact --config .gitleaks.toml .'

  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências (lockfile congelado, sem scripts de instalação)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formatação
        run: pnpm format:check
      - name: Tipos
        run: pnpm typecheck
      - name: PostgreSQL descartável para os testes de segurança
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          docker run --detach --name cerebro-test-pg \
            --env POSTGRES_PASSWORD="${password}" \
            --publish 127.0.0.1:5432:5432 \
            postgres:16
          for _ in $(seq 1 60); do
            if docker exec cerebro-test-pg pg_isready --username postgres --quiet; then break; fi
            sleep 1
          done
          docker exec cerebro-test-pg pg_isready --username postgres
          echo "TEST_PG_ADMIN_URL=postgres://postgres:${password}@127.0.0.1:5432/postgres" >> "${GITHUB_ENV}"
      - name: Testes
        run: pnpm test

  dependencies:
    name: Auditoria de dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Vulnerabilidades conhecidas
        run: pnpm audit --audit-level=high
      - name: Revisão das dependências novas do PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
