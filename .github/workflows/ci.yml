name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: nenhum job recebe mais do que leitura do código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (versão fixa, checksum conferido)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Varrer todo o histórico
        run: '"${RUNNER_TEMP}/gitleaks/gitleaks" git --no-banner --redact --config .gitleaks.toml .'

  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências (lockfile congelado, sem scripts de instalação)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formatação
        run: pnpm format:check
      - name: Tipos
        run: pnpm typecheck
      - name: PostgreSQL descartável para os testes de segurança
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          docker run --detach --name cerebro-test-pg \
            --env POSTGRES_PASSWORD="${password}" \
            --publish 127.0.0.1:5432:5432 \
            postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
          for _ in $(seq 1 60); do
            if docker exec cerebro-test-pg pg_isready --username postgres --quiet; then break; fi
            sleep 1
          done
          docker exec cerebro-test-pg pg_isready --username postgres
          echo "TEST_PG_ADMIN_URL=postgres://postgres:${password}@127.0.0.1:5432/postgres" >> "${GITHUB_ENV}"
      - name: Testes
        run: pnpm test

  browser:
    name: Percurso em navegador real
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependências (lockfile congelado, sem scripts de instalação)
        run: pnpm install --frozen-lockfile
      - name: Navegador na versão fixada pelo lockfile
        run: pnpm --filter @cerebro/web exec playwright install --with-deps chromium
      - name: PostgreSQL descartável
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          docker run --detach --name cerebro-e2e-pg \
            --env POSTGRES_PASSWORD="${password}" \
            --publish 127.0.0.1:5432:5432 \
            postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
          for _ in $(seq 1 60); do
            if docker exec cerebro-e2e-pg pg_isready --username postgres --quiet; then break; fi
            sleep 1
          done
          docker exec cerebro-e2e-pg pg_isready --username postgres
          echo "TEST_PG_ADMIN_URL=postgres://postgres:${password}@127.0.0.1:5432/postgres" >> "${GITHUB_ENV}"
      - name: Instalar, entrar, convidar, aprovar, liberar e suspender, num navegador de verdade
        run: pnpm e2e

  container:
    name: Imagem e Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_FILE: infra/compose.yaml
      CEREBRO_PUBLIC_ORIGIN: https://cerebro.exemplo.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Imagens de fora fixadas pelo hash
        run: |
          # Uma tag pode passar a apontar para outra coisa; o hash, não. O Dependabot propõe
          # os hashes novos.
          unpinned="$(grep -nE '^FROM |^[[:space:]]+image: |^[[:space:]]+postgres:[0-9]' \
            apps/*/Dockerfile infra/compose.yaml .github/workflows/*.yml \
            | grep -vE '@sha256:[0-9a-f]{64}|\$\{|--from=' || true)"
          if [ -n "${unpinned}" ]; then
            echo "Imagem sem hash:"
            echo "${unpinned}"
            exit 1
          fi
      - name: Construir a imagem da API
        run: docker build --file apps/api/Dockerfile --tag cerebro-api:local .
      - name: Construir a imagem do atualizador
        run: docker build --file apps/updater/Dockerfile --tag cerebro-updater:local .
      - name: Construir a imagem do backup
        run: docker build --file apps/backup/Dockerfile --tag cerebro-backup:local .
      - name: Subir uma instalação do zero
        run: |
          docker compose up --detach
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --show-error --fail http://127.0.0.1:3000/api/health
      - name: Conferir o que a instalação promete
        run: |
          set -euo pipefail
          echo "instalação nova pede o assistente e não deixa ninguém entrar"
          test "$(curl --silent http://127.0.0.1:3000/api/setup/status | jq --raw-output .needsSetup)" = "true"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/me)" = "401"

          echo "a página vem com a política que proíbe código embutido e de outras origens"
          curl --silent --show-error --fail --dump-header headers.txt --output page.html http://127.0.0.1:3000/
          grep --quiet '<div id="app">' page.html
          grep --ignore-case --quiet "^content-security-policy: default-src 'none'; script-src 'self'; style-src 'self'" headers.txt
          if grep --ignore-case '^content-security-policy:' headers.txt | grep --quiet 'unsafe'; then exit 1; fi
          asset="$(grep --only-matching '/assets/[^"]*\.js' page.html | head -n 1)"
          curl --silent --show-error --fail --output /dev/null "http://127.0.0.1:3000${asset}"

          echo "a API não roda como root e não consegue alterar o próprio código"
          test "$(docker compose exec -T api id -u)" != "0"
          if docker compose exec -T api sh -c 'touch /app/dist/x' 2> /dev/null; then exit 1; fi

          echo "os segredos existem só no volume de configuração, com permissão restrita"
          test "$(docker compose exec -T api stat -c '%a' /opt/cerebro/config/api/secrets.json)" = "600"
          test "$(docker compose exec -T api stat -c '%a' /opt/cerebro/config/updater/updater-key)" = "600"
          docker compose exec -T api test -s /opt/cerebro/config/setup/setup-token
          token="$(docker compose exec -T api cat /opt/cerebro/config/setup/setup-token)"

          echo "a API vê só a própria pasta, a chave do atualizador e o token: nem a senha de administrador do banco, nem a chave das cópias"
          test "$(docker compose exec -T api ls -A /opt/cerebro/config | sort | tr '\n' ' ')" = "api setup updater "
          # E não escreve na própria pasta: só na do token.
          if docker compose exec -T api sh -c 'touch /opt/cerebro/config/api/x' 2> /dev/null; then exit 1; fi
          if docker compose exec -T api grep --quiet adminPassword /opt/cerebro/config/api/secrets.json; then exit 1; fi
          test "$(docker compose exec -T api ls -A /opt/cerebro/config/updater)" = "updater-key"
          if docker compose exec -T api touch /opt/cerebro/config/updater/x 2> /dev/null; then exit 1; fi
          if docker compose logs --no-color | grep --fixed-strings --quiet "${token}"; then exit 1; fi
          if docker compose config | grep --ignore-case --quiet 'password:'; then exit 1; fi

          echo "o atualizador tem cosign e o cliente do Docker, e não sobe sem saber qual repositório seguir"
          docker run --rm --entrypoint cosign cerebro-updater:local version > /dev/null
          docker run --rm --entrypoint docker cerebro-updater:local compose version > /dev/null
          if docker run --rm cerebro-updater:local 2> /dev/null; then exit 1; fi

          echo "o backup copia de verdade, cifrado, restaura num banco descartável, e não roda como root"
          test "$(docker run --rm --entrypoint id cerebro-backup:local -u)" = "1000"
          docker run --rm --entrypoint pg_dump cerebro-backup:local --version | grep --quiet ' 16\.'
          CEREBRO_BACKUP_NOW=backup+test docker compose --profile backup up --detach backup
          for _ in $(seq 1 60); do
            if docker compose exec -T api cat /opt/cerebro/backup-status/backup.json 2> /dev/null \
              | jq --exit-status '.lastRestoreTest != null' > /dev/null; then break; fi
            sleep 3
          done
          docker compose exec -T api cat /opt/cerebro/backup-status/backup.json > backup.json
          test "$(docker compose --profile backup exec -T backup stat -c '%a' /data/config/backup/backup-password)" = "600"
          # What the service says about itself (dates, sizes and sentences only; no secrets).
          jq '{lastBackup, lastRestoreTest}' backup.json
          jq --exit-status '.lastBackup.ok == true and (.lastBackup.snapshot | length) > 0' backup.json
          # A fresh installation has nobody yet: the test restores and queries, and says so.
          jq --exit-status '.lastRestoreTest.ok == true or .lastRestoreTest.problem == "A cópia restaurada não tem ninguém."' backup.json
          # Fora da rede da API: daqui ninguém se faz passar pelo proxy na frente dela.
          if docker inspect --format '{{range $name, $net := .NetworkSettings.Networks}}{{$name}} {{end}}' "$(docker compose --profile backup ps --quiet backup)" | grep --quiet "_edge "; then exit 1; fi
          docker compose --profile backup stop backup

          echo "os formulários só veem a própria pasta, servem só formulários e o papel deles não lê tabela"
          CEREBRO_FORMS_ORIGIN=https://formularios.exemplo.test docker compose --profile forms up --detach --wait forms
          docker compose exec -T forms test -s /opt/cerebro/forms-config/db-password
          if docker compose exec -T forms test -e /opt/cerebro/forms-config/secrets.json; then exit 1; fi
          # The image has the folder the API mounts the configuration on; here it stays empty.
          test -z "$(docker compose exec -T forms ls -A /opt/cerebro/config)"
          test "$(docker compose exec -T forms id -u)" != "0"
          if docker inspect --format '{{range $name, $net := .NetworkSettings.Networks}}{{$name}} {{end}}' "$(docker compose --profile forms ps --quiet forms)" | grep --quiet "_edge "; then exit 1; fi
          for path in /f/AAAAAAAAAAAAAAAAAAAAAA /api/me /; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: formularios.exemplo.test' "http://127.0.0.1:3001${path}")" = "404"
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: cerebro.exemplo.test' http://127.0.0.1:3001/f/AAAAAAAAAAAAAAAAAAAAAA)" = "404"
          curl --silent --dump-header forms-headers.txt --output /dev/null --header 'Host: formularios.exemplo.test' http://127.0.0.1:3001/f/AAAAAAAAAAAAAAAAAAAAAA
          grep --ignore-case --quiet "^content-security-policy: default-src 'none'" forms-headers.txt
          test "$(docker compose exec -T postgres psql --username postgres --dbname cerebro --tuples-only --no-align --command "SELECT has_table_privilege('cerebro_forms', 'app.items', 'SELECT') OR has_table_privilege('cerebro_forms', 'app.users', 'SELECT')")" = "f"
          docker compose --profile forms stop forms

          echo "o banco não está publicado para fora da rede interna"
          if docker compose port postgres 5432 2> /dev/null | grep --quiet .; then exit 1; fi

          echo "reiniciar não troca os segredos nem reabre nada"
          before="$(docker compose exec -T api sha256sum /opt/cerebro/config/api/secrets.json)"
          docker compose up --detach --force-recreate
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          test "${before}" = "$(docker compose exec -T api sha256sum /opt/cerebro/config/api/secrets.json)"
      - name: Antivírus com poucas permissões, numa rede de saída só dele
        run: |
          # A imagem já traz as assinaturas: o clamd responde sem esperar baixar nada.
          docker compose --profile antivirus up --detach clamav
          for _ in $(seq 1 90); do
            if docker compose --profile antivirus exec -T clamav clamdscan --ping 1 > /dev/null 2>&1; then break; fi
            sleep 5
          done
          docker compose --profile antivirus exec -T clamav clamdscan --ping 1
          container="$(docker compose --profile antivirus ps --quiet clamav)"
          test "$(docker inspect --format '{{.HostConfig.CapDrop}}' "${container}")" = "[ALL]"
          test "$(docker inspect --format '{{len .NetworkSettings.Networks}}' "${container}")" = "2"
          docker inspect --format '{{range $name, $net := .NetworkSettings.Networks}}{{$name}} {{end}}' "${container}" | grep --quiet "clamav-out"
          if docker inspect --format '{{range $name, $net := .NetworkSettings.Networks}}{{$name}} {{end}}' "${container}" | grep --quiet "_edge"; then exit 1; fi
      - name: Logs em caso de falha
        if: failure()
        run: docker compose --profile backup --profile antivirus logs --no-color --tail 200 || true
      - name: Derrubar
        if: always()
        run: docker compose --profile backup --profile forms --profile antivirus down --volumes

  dependencies:
    name: Auditoria de dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Vulnerabilidades conhecidas
        run: pnpm audit --audit-level=high
      - name: Revisão das dependências novas do PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
