name: Release

# Roda só quando um mantenedor publica uma release (com a versão no nome da tag, 1.2.3 ou
# v1.2.3), e só depois de alguém aprovar o ambiente "release" no GitHub. Publica as imagens
# da API, do atualizador e das cópias no GHCR, assina tudo sem chave guardada (identidade do
# próprio fluxo, via OIDC), gera o SBOM e anexa à release o manifesto que o atualizador exige.
#
# O atualizador só aceita uma assinatura feita por este fluxo, disparado pela publicação da
# release, a partir do commit da tag, e só se esse commit estiver no ramo principal (onde as
# mudanças passam por revisão). Uma cópia alterada deste arquivo, empurrada numa tag fora do
# ramo principal, assina com outro commit e é recusada.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Imagens assinadas, SBOM e manifesto
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write # anexar o manifesto, a assinatura e o SBOM à release
      packages: write # publicar as imagens no GHCR
      id-token: write # assinar sem chave guardada, com a identidade deste fluxo
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: O commit da tag está no ramo principal
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
            echo "A tag aponta para um commit fora de ${DEFAULT_BRANCH}: nada é publicado."
            exit 1
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Versão da tag
        run: |
          if ! [[ "${TAG}" =~ ^v?([0-9]{1,4})\.([0-9]{1,4})\.([0-9]{1,4})$ ]]; then
            echo "A tag precisa ser uma versão (1.2.3 ou v1.2.3): ${TAG}"
            exit 1
          fi
          echo "VERSION=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "${GITHUB_ENV}"
          echo "REGISTRY_PATH=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"
          echo "MIN_FROM=$(tr -d '[:space:]' < infra/release/min-from)" >> "${GITHUB_ENV}"

      - name: Entrar no GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar as imagens
        run: |
          docker build --file apps/api/Dockerfile --build-arg "CEREBRO_VERSION=${VERSION}" \
            --tag "${REGISTRY_PATH}/api:${VERSION}" .
          docker build --file apps/updater/Dockerfile --tag "${REGISTRY_PATH}/updater:${VERSION}" .
          docker build --file apps/backup/Dockerfile --tag "${REGISTRY_PATH}/backup:${VERSION}" .
          docker push "${REGISTRY_PATH}/api:${VERSION}"
          docker push "${REGISTRY_PATH}/updater:${VERSION}"
          docker push "${REGISTRY_PATH}/backup:${VERSION}"
          api="$(docker inspect --format '{{index .RepoDigests 0}}' "${REGISTRY_PATH}/api:${VERSION}")"
          updater="$(docker inspect --format '{{index .RepoDigests 0}}' "${REGISTRY_PATH}/updater:${VERSION}")"
          backup="$(docker inspect --format '{{index .RepoDigests 0}}' "${REGISTRY_PATH}/backup:${VERSION}")"
          echo "API_DIGEST=${api#*@}" >> "${GITHUB_ENV}"
          echo "UPDATER_DIGEST=${updater#*@}" >> "${GITHUB_ENV}"
          echo "BACKUP_DIGEST=${backup#*@}" >> "${GITHUB_ENV}"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Assinar as imagens pelo digest
        run: |
          cosign sign --yes "${REGISTRY_PATH}/api@${API_DIGEST}"
          cosign sign --yes "${REGISTRY_PATH}/updater@${UPDATER_DIGEST}"
          cosign sign --yes "${REGISTRY_PATH}/backup@${BACKUP_DIGEST}"

      - name: SBOM da imagem da API
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY_PATH }}/api@${{ env.API_DIGEST }}
          format: spdx-json
          output-file: sbom-api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Atestar o SBOM na imagem
        run: |
          cosign attest --yes --type spdxjson --predicate sbom-api.spdx.json \
            "${REGISTRY_PATH}/api@${API_DIGEST}"

      - name: Manifesto da versão, assinado
        run: |
          jq --null-input \
            --arg version "${VERSION}" \
            --arg image "${REGISTRY_PATH}/api" \
            --arg digest "${API_DIGEST}" \
            --arg minFrom "${MIN_FROM}" \
            '{version: $version, image: $image, digest: $digest, minFrom: $minFrom}' \
            > cerebro-release.json
          cosign sign-blob --yes --bundle cerebro-release.json.sigstore.json cerebro-release.json

      - name: Endereços das imagens, para o .env da instalação
        run: |
          {
            echo "CEREBRO_IMAGE=${REGISTRY_PATH}/api@${API_DIGEST}"
            echo "CEREBRO_VERSION=${VERSION}"
            echo "CEREBRO_UPDATER_IMAGE=${REGISTRY_PATH}/updater@${UPDATER_DIGEST}"
            echo "CEREBRO_BACKUP_IMAGE=${REGISTRY_PATH}/backup@${BACKUP_DIGEST}"
          } > cerebro-images.env

      - name: Anexar à release
        run: |
          gh release upload "${TAG}" --clobber \
            cerebro-release.json cerebro-release.json.sigstore.json sbom-api.spdx.json \
            cerebro-images.env
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
